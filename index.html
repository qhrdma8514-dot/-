<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
    body { background: transparent; }
    .container { display: flex; gap: 20px; max-width: 1000px; margin: 0 auto; }
    
    /* 좌측 메뉴 바 스타일 */
    .menu { width: 170px; flex-shrink: 0; background: #f2f6fc; border-radius: 12px; padding: 12px; height: fit-content; }
    .menu button { display: block; width: 100%; text-align: left; padding: 12px 14px; border: none; background: none; font-size: 14px; font-weight: bold; color: #4b5563; cursor: pointer; border-radius: 8px; margin-bottom: 4px; transition: 0.2s; }
    .menu button:hover { background: #e5e7eb; }
    .menu button.active { color: #1d4ed8; background: #e0ebff; }

    /* 우측 본문 박스 스타일 */
    .content { flex-grow: 1; }
    .tab-panel { display: none; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 28px; }
    .tab-panel.active { display: block; }
    h2 { font-size: 20px; font-weight: 800; color: #1d4ed8; margin-bottom: 16px; }
    p { font-size: 14px; line-height: 1.6; color: #374151; }
  </style>
</head>
<body>

<div class="container">
  <!-- 좌측 버튼 목록 -->
  <div class="menu">
    <button class="active" onclick="openTab(event, 'about')">About LEINIEL</button>
    <button onclick="openTab(event, 'price')">Price</button>
    <button onclick="openTab(event, 'process')">Process</button>
    <button onclick="openTab(event, 'guide')">신청 가이드</button>
    <button onclick="openTab(event, 'notice')">Notice</button>
  </div>

  <!-- 우측 본문 콘텐츠 영역 -->
  <div class="content">
    <div id="about" class="tab-panel active">
      <h2>ABOUT LEINIEL</h2>
      <p style="font-weight: bold; font-size: 16px; margin-bottom: 12px;">Add Life To Your Music</p>
      <p>☁️ 믹싱&마스터링 엔지니어 레이니엘입니다.<br>찾아주시는 모든 클라이언트분들이 만족할 수 있는 남다른 섬세함과 진정성을 가지고 작업에 임하고 있습니다.</p>
    </div>

    <div id="price" class="tab-panel">
      <h2>PRICE</h2>
      <p>가격표 및 안내 내용을 여기에 작성하세요.</p>
    </div>

    <div id="process" class="tab-panel">
      <h2>PROCESS</h2>
      <p>작업 진행 과정 및 순서를 작성하세요.</p>
    </div>

    <div id="guide" class="tab-panel">
      <h2>신청 가이드</h2>
      <p>음원 제출 규격 및 안내 사항을 작성하세요.</p>
    </div>

    <div id="notice" class="tab-panel">
      <h2>NOTICE</h2>
      <p>주의사항 및 환불 규정을 작성하세요.</p>
    </div>
  </div>
</div>

<script>
  function openTab(evt, tabName) {
    var panels = document.getElementsByClassName("tab-panel");
    for (var i = 0; i < panels.length; i++) {
      panels[i].classList.remove("active");
    }
    var buttons = document.querySelectorAll(".menu button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove("active");
    }
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
  }
</script>

</body>
</html>
